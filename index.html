<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Halısaha Menajeri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: FM27 oyuncu ekranı. Kulüp rengine boyanan üst şerit ve başlık, altında tek karo içinde Pozisyonlar | Teknik | Zihinsel | Fiziksel | Bilgi sütunları, en altta durum karoları. Yatay telefon için sıkı; dikeyde sütunlar alt alta. Tek (koyu) tema bilinçli seçim. */
:root{
  color-scheme:dark;
  --club:#1f7a3d;
  --bg:#08090a; --tile:#111214; --tile2:#1a1b1f; --line:#2c2d33;
  --fg:#f3f3f5; --mut:#a3a4ad; --accent:#7c3aed; --hot:#d6249f;
  --n-lo:#8b8c95; --n-mid:#f3f3f5; --n-good:#f2d24b; --n-top:#4fe07f;
  --key:#35c46a; --pref:#3b7bf0;
  --grass1:#2c7a45; --grass2:#27703f; --chalk:#d9f0df; --danger:#ff6b7d;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg) linear-gradient(180deg,color-mix(in srgb,var(--club) 46%,#050506) 0,var(--bg) 360px) no-repeat;color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:88px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--club) 62%,#050506)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:1px}
.wrap{max-width:1180px;margin:0 auto}

/* üst şerit */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--club) 62%,#050506);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));box-shadow:0 1px 0 #0006}
.top .wrap{display:flex;align-items:center;gap:8px}
.arr{width:30px;height:32px;border-radius:6px;background:#0004;text-align:center;font-size:18px;flex:none}
.badge{width:32px;height:32px;border-radius:8px;flex:none;border:2px solid #fff;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:11px;text-shadow:0 1px 2px #000}
.badge.logo{border:0;background:none;border-radius:0}
.badge.logo img{width:100%;height:100%;object-fit:contain}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--tile);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs button{padding:10px 4px;text-align:center;font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fffb;border-radius:6px}
.tabs button.on{color:#fff;background:#fff2}
.date{margin-left:auto;background:#0005;border-radius:6px;padding:3px 9px;min-width:0;line-height:1.15}
.date b{display:block;font-family:var(--cond);font-size:14px;letter-spacing:.03em}
.date span{font-size:11px;color:#fffc}
.time{background:#fff;color:#000;font-weight:700;font-size:12px;border-radius:5px;padding:2px 6px;flex:none}
.lock{flex:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:700;background:var(--hot);color:#fff}
.lock.on{background:#fff;color:#000}

/* alt şerit: oyuncu seçimi + sekmeler */
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:6px 0;border-bottom:1px solid #fff2}
.sel{background:#0005;border:1px solid #fff3;border-radius:6px;height:34px;font-size:16px;padding:0 6px;min-width:0;max-width:100%}
.stab{padding:6px 2px;font-weight:600;color:#fffc;border-bottom:2px solid transparent}
.stab.on{color:#fff;border-bottom-color:#fff}

/* oyuncu başlığı */
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 0}
.ph{width:92px;height:104px;border-radius:8px;background:#0005;display:grid;place-items:center;overflow:hidden;position:relative;font-family:var(--cond);font-size:34px;font-weight:700;color:#fffc;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cam{position:absolute;inset:auto 0 0;background:#000b;font-family:var(--body);font-size:10px;font-weight:600;text-align:center;color:#fff;padding:2px}
.hb{min-width:0;display:flex;flex-direction:column;gap:3px}
.hb.sep{border-left:1px solid #fff3;padding-left:16px}
.nm{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1.05;display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px}
.ovr{font-family:var(--cond);font-size:17px;font-weight:700;background:var(--key);color:#041b0c;border-radius:5px;padding:0 6px;line-height:1.35}
.dim{color:#fffc;font-size:13px}
.chip{align-self:flex-start;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700}
.chip.st{background:var(--key);color:#041b0c}
.chip.val{background:#0006;border:1px solid #fff3;font-size:13px}
.stars{display:inline-flex;gap:1px}
.stars i{font-style:normal;font-size:15px;line-height:1;color:#fff3;cursor:pointer;display:inline-block}
.stars i.f{color:var(--n-good)}
.stars i.h{background:linear-gradient(90deg,var(--n-good) 50%,#fff3 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.two5{display:flex;gap:16px}

/* düzenlenebilir alan */
.fld{display:inline-block;min-width:1.4em;border-radius:3px;padding:0 3px;margin:0 -3px;overflow-wrap:anywhere;text-align:inherit}
.ed .fld{box-shadow:inset 0 -1px 0 #fff8;background:#ffffff14}
.fld.empty{color:var(--mut);font-weight:400}

/* ana karo */
.pn{background:var(--tile);border:1px solid var(--line);border-radius:8px;min-width:0}
.main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px;align-items:start}
.main>*{min-width:0}
.cpos,.cinfo{grid-column:1/-1}
.ct{font-size:11px;font-weight:600;color:var(--mut);margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ct+.ar,.ar+.ct{margin-top:0}
.ar+.ct{margin-top:6px;padding-top:4px;border-top:1px solid var(--line)}
.ar{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;padding:3px 8px;font-size:13px;font-weight:500;border-left:3px solid transparent}
.ar:nth-of-type(odd){background:var(--tile2)}
.ar.k1{border-left-color:var(--key);background:color-mix(in srgb,var(--key) 26%,var(--tile))}
.ar.k2{border-left-color:var(--pref);background:color-mix(in srgb,var(--pref) 30%,var(--tile))}
.ar span:first-child{min-width:0;overflow-wrap:anywhere}
.av{font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.av.c4{border:1px solid var(--n-top);border-radius:4px;text-align:center;padding:0 3px}
.bx .av{text-align:center;border-radius:4px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 16%,transparent);padding:0 3px}
.c0{color:var(--n-lo)}.c1{color:var(--n-mid)}.c2{color:var(--n-good)}.c3,.c4{color:var(--n-top)}
.mini{font-size:11px;font-weight:600;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--tile2)}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.danger{color:var(--danger)}
.note{color:var(--mut);font-size:12px;margin:0}
.x{color:var(--danger);font-weight:700;padding:0 6px;font-size:15px}

/* pozisyonlar */
.mp{position:relative;width:100%;max-width:230px;aspect-ratio:10/7;margin:6px auto;border:2px solid #cfe6d6;border-radius:3px;background:#1d4a31}
.mp::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #cfe6d688}
.mp::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:1px solid #cfe6d688;border-radius:50%;transform:translate(-50%,-50%)}
.dot{position:absolute;width:13px;height:13px;border-radius:50%;background:#0f2a1c;transform:translate(-50%,-50%);z-index:1}
.dot.d1{background:#f59a23}.dot.d2{background:#63e36f;box-shadow:0 0 0 2px #fff}
.cen{text-align:center}
.seg{display:flex;justify-content:center;margin:6px 0}
.seg button{padding:6px 10px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--tile2)}
.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button.on{background:var(--accent);border-color:var(--accent)}
.rr{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px}
.rr:nth-of-type(odd){background:var(--tile2)}
.rr.on{background:color-mix(in srgb,var(--accent) 70%,var(--tile))}
.rr .rad{width:16px;height:16px;border-radius:50%;border:2px solid #fffb;flex:none;display:grid;place-items:center}
.rr.on .rad::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.rr .rn{flex:1;min-width:0}
.feet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.bars{display:flex;gap:3px;margin-top:3px}
.bars i{width:14px;height:4px;border-radius:2px;background:#fff2}
.legend{display:flex;justify-content:center;gap:12px;font-size:12px;color:var(--mut);grid-column:1/-1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.info{display:flex;flex-wrap:wrap;gap:8px 18px}
.info .val{font-weight:600;display:block}
.tr{display:flex;align-items:baseline;gap:6px;font-weight:600;font-size:13px;padding:2px 0}
.tr::before{content:"•";color:var(--mut)}

/* alt karolar */
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.tile{flex:1 1 130px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.tile.wide{flex:3 1 320px}
.tile h3{margin:0 0 2px;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:6px}
.big{font-size:16px;font-weight:700}
.pill{align-self:flex-start;border-radius:999px;padding:1px 9px;font-weight:700;font-size:12px;background:#3a3b42}
.pill.red{background:#c2273c}
.l5{display:flex;gap:3px}
.l5 button{width:22px;height:24px;border-radius:2px;background:#4a4b52}
.l5 .g1{background:#35c46a}.l5 .g2{background:#e2b93b}.l5 .g3{background:#d5374c}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;color:var(--mut);text-align:left;font-weight:600;padding:5px 7px;white-space:nowrap}
.tbl td{padding:7px 7px;border-top:1px solid var(--line)}
.tbl tr[data-go],.tbl tr[data-slotrow]{cursor:pointer}
.tbl .n{font-weight:600;overflow-wrap:anywhere}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:700}
.hr{display:grid;grid-template-columns:92px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.hr:last-of-type{border-bottom:0}
.hr .d{font-weight:600;font-variant-numeric:tabular-nums;color:var(--n-good)}

/* kadro + taktik */
.stack{display:flex;flex-direction:column;gap:10px}
.pad{padding-top:12px}
.pn>h2{margin:0;padding:8px 11px;font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pn>.bd{padding:10px 11px}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2>*{min-width:0}
.bio{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px}
.bio .val{font-weight:600}
.pos{display:inline-block;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.04em;padding:1px 7px;border-radius:4px;background:var(--tile2);border:1px solid var(--line)}
.xi{color:var(--n-top);font-size:10px;font-weight:700;letter-spacing:.06em}
input[type=color]{width:40px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.kgrid,.tgrid{display:grid;gap:10px;align-items:start}
.kgrid>*,.tgrid>*{min-width:0}
.pcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.pitch{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:repeating-linear-gradient(180deg,var(--grass1) 0 12.5%,var(--grass2) 12.5% 25%)}
.pitch::before{content:"";position:absolute;inset:3%;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);pointer-events:none}
.mk{position:absolute;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);pointer-events:none}
.mk.mid{left:3%;right:3%;top:50%;border-width:1px 0 0}
.mk.cc{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.mk.b1{left:27%;right:27%;top:3%;height:13%;border-top:0}
.mk.b2{left:27%;right:27%;bottom:3%;height:13%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:27%;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.shirt{width:40px;height:36px;position:relative}
.shirt svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #0007)}
.shirt b{position:absolute;inset:8px 0 0;font-family:var(--cond);font-size:15px;font-weight:700;text-shadow:0 1px 2px #000}
.slot .pn2{font-size:12px;font-weight:600;line-height:1.1;background:#0b0b0dcc;color:#fff;border-radius:4px;padding:2px 6px;max-width:100%;overflow-wrap:anywhere}
.slot .rl{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.03em;background:var(--accent);color:#fff;border-radius:4px;padding:0 6px;max-width:100%;overflow-wrap:anywhere}
.slot.none .pn2{color:#ffd9de}
.rot{display:none;margin:10px 0 0;padding:8px 12px;border:1px solid #fff3;border-radius:8px;background:#0006;font-size:12px}
.warn{background:color-mix(in srgb,var(--danger) 18%,transparent);border:1px solid var(--danger);border-radius:8px;padding:8px 10px;font-size:12px;margin:10px 0 0}
.cloud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;margin-top:8px;color:#fffd}
.cloud:empty{display:none}
.cloud img{width:22px;height:22px;border-radius:50%}
.cloud .gbtn{background:#fff;color:#1f1f1f;font-weight:700;border-radius:6px;padding:7px 12px}
.emptyc{padding:22px 14px;display:flex;flex-direction:column;gap:10px;text-align:center;margin-top:14px}
.emptyc h3{margin:0;font-family:var(--cond);font-size:22px;text-transform:uppercase}

/* alt sayfa */
.sheet{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--tile);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:9px}
.sheet h3{margin:0;font-family:var(--cond);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.sheet h3 span{color:var(--mut);font-variant-numeric:tabular-nums}
.inp{width:100%;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.grid20{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid20 button,.opt button{padding:9px 0;text-align:center;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:17px}
.grid20 button.on,.opt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.opt button{font-size:13px}
.btn{display:block;width:100%;text-align:center;background:var(--hot);color:#fff;font-weight:700;border-radius:8px;padding:10px}
.btn.ghost{background:var(--tile2);border:1px solid var(--line);color:var(--fg)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 4px;border-top:1px solid var(--line)}
.pick .n{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tgrid2{display:grid;gap:10px;align-items:start}
.tgrid2>*{min-width:0}
.ig{padding:8px 10px}
.ir{padding:6px 0;border-top:1px solid #fff2}
.io{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.io button{padding:5px 9px;border-radius:5px;background:#0005;border:1px solid #fff3;font-size:12px;font-weight:600}
.io button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (min-width:640px){.tgrid2{grid-template-columns:1fr 1fr}}

/* taktik ekranı (FM27 takım seçimi) */
.tk{display:flex;flex-direction:column;gap:8px}
.tk .pn{background:color-mix(in srgb,var(--club) 26%,#0d1211);border-color:color-mix(in srgb,var(--club) 55%,#26272c)}
.thead{display:flex;align-items:center;gap:10px}
.tt{font-family:var(--cond);font-size:21px;font-weight:700;line-height:1.1}
.tbar{display:flex;flex-wrap:wrap;gap:6px;padding:7px}
.tchip{display:inline-flex;align-items:center;gap:6px;background:#0005;border:1px solid #fff3;border-radius:6px;padding:4px 9px;min-width:0}
.tchip i{font-style:normal;color:var(--mut);font-size:12px}
.tchip select{background:transparent;border:0;font-size:16px;font-weight:700;max-width:100%}
.tk .pitch{background:#2f7a68;border-color:#e6f2ee88;border-radius:4px}
.tk .pitch .slot,.ybox button{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag{z-index:6;opacity:.9;filter:drop-shadow(0 6px 8px #000a)}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.pick small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.pick.cur{background:#ffffff14}
.pick .stars i{cursor:inherit;font-size:12px}
.io button b{color:var(--n-good)}.io button.on b{color:#fff}
.tk .seg button{white-space:nowrap;padding:5px 8px;font-size:12px}
.tk .slot{width:25%;gap:1px}
.tk .shirt{width:30px;height:27px}
.tk .shirt b{inset:5px 0 0;font-size:12px}
.rb{display:flex;border-radius:4px;overflow:hidden;font-family:var(--cond);font-size:11px;font-weight:700;color:#fff;max-width:100%}
.rb b{padding:0 5px}.rb b+b{filter:brightness(.78)}
.tk .slot .stars i{font-size:9px;cursor:inherit}
.tk .slot .pn2{font-size:11px;padding:1px 5px}
.pg{background:#2f9e58}.pp{background:#7c3aed}.pk{background:#c81f6b}.pb{background:#2f6fe0}.gy{background:#33343b;box-shadow:inset 0 0 0 1px #5a5b63}
.sp{display:inline-block;min-width:46px;text-align:center;border-radius:5px;padding:3px 7px;font-weight:700;font-size:12px;white-space:nowrap;color:#fff}
.sp.sec{color:var(--mut);font-weight:500}
.sq th,.sq td{white-space:nowrap}
.sq tbody tr:nth-child(odd){background:#0005}
.sq td{border-top:0}
.sq .c{text-align:center}
.sq .stars i{cursor:inherit;font-size:13px}
.tn{display:inline-block;min-width:20px;text-align:center;border-radius:4px;font-family:var(--cond);font-weight:700;font-size:12px;padding:0 3px}
.yh{margin:0 0 6px;font-family:var(--cond);font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}

function fresh(){const t=mkTeam({});return{v:3,cur:t.id,sel:'',tab:'profil',ptab:'genel',phase:'all',rph:'ip',boxes:false,edit:true,teams:[t]}}

// Mevki gruplarına göre roller: [kısaltma, ad] (topa sahipken / top rakipteyken)
const ROLE={
 // Kaleci
 KL:{ip:[['KL','Kaleci'],['OKK','Oyun Kurucu Kaleci'],['GK','Garantici Kaleci']],
     oop:[['KL','Kaleci'],['ÇK','Çizgi Kalecisi'],['LK','Libero Kaleci']]},
 // Stoper
 DFM:{ip:[['S','Stoper'],['OKS','Oyun Kurucu Stoper'],['İÇS','İleri Çıkan Stoper'],['GS','Garantici Stoper']],
      oop:[['S','Stoper'],['KGS','Kademeye Giren Stoper'],['ÖÇS','Öne Çıkan Stoper']]},
 // Bek + Kanat Bek
 DFW:{ip:[['B','Bek'],['İKB','İçe Kat Eden Bek'],['KB','Kanat Bek'],['İLB','İleri Kanat Bek'],['OKB','Oyun Kurucu Kanat Bek'],['İKK','İçe Kat Eden Kanat Bek']],

 // Defansif Orta Saha
 DOS:{ip:[['DOS','Defansif Orta Saha'],['GOK','Geriden Oyun Kurucu'],['YS','Yarı Stoper'],['İYO','İki Yönlü Orta Saha'],['İYK','İki Yönlü Oyun Kurucu']],
      oop:[['DOS','Defansif Orta Saha'],['GÇD','Geriye Çekilen DOS'],['PD','Perdeleyen DOS'],['KKD','Kanadı Kapatan DOS']]},
 // Merkez Orta Saha
 OSM:{ip:[['OS','Merkez Orta Saha'],['OK','Orta Saha Oyun Kurucusu'],['GOS','Geniş Merkez Orta Saha'],['İYO','İki Yönlü Orta Saha'],['İYK','İki Yönlü Oyun Kurucu'],['KOS','Koridor Orta Sahası'],['İOK','İleri Oyun Kurucu']],
      oop:[['OS','Merkez Orta Saha'],['BOS','Baskıcı Orta Saha'],['POS','Perdeleyen Orta Saha'],['KKO','Kanadı Kapatan Orta Saha']]},
 // Kanat Orta Saha + Kanat
 OSW:{ip:[['KO','Kanat Orta Saha'],['KNT','Kanat'],['İK','İçe Kat Eden Kanat'],['OKN','Oyun Kurucu Kanat']],
      oop:[['KO','Kanat Orta Saha'],['TKO','Takipçi Kanat Orta Saha'],['ÇKO','Çıkış Kanat Orta Sahası'],['KNT','Kanat'],['TK','Takipçi Kanat']]},
 // Ofansif Orta Saha
 OOS:{ip:[['OOS','Ofansif Orta Saha'],['İOK','İleri Oyun Kurucu'],['KOS','Koridor Orta Sahası'],['SRB','Serbest Rol'],['GF','Gizli Forvet']],
      oop:[['OOS','Ofansif Orta Saha'],['MBO','Merkezde Bekleyen OOS'],['KAO','Kanada Açılan OOS'],['TOO','Takipçi OOS']]},
 // Santrafor

};
const slotGrp=s=>{const w=s[0]<35||s[0]>65,c=s[2];return c==='KL'?'KL':c==='DF'?(w?'DFW':'DFM'):c==='DOS'?'DOS':c==='OOS'?'OOS':c==='OS'?(w?'OSW':'OSM'):(w?'FVW':'FVM')};
const defRoles=(fk,ph)=>FORM[fk].map(s=>ROLE[slotGrp(s)][ph?'oop':'ip'][0][0]);
const roleName=(g,phase,ab)=>{const r=ROLE[g][phase].find(x=>x[0]===ab);return r?r[1]:ab};
// mevki uygunluğu: oyuncunun Pozisyonlar sahasındaki noktalarına göre
const SUIT=[['Uygun değil','#e0524f'],['Zorlanır','#f0a03a'],['Yapabilir','#b6e04f'],['Doğal','#4fe07f']];
function suit(p,s){const m=p.posmap||[];if(s[2]==='KL')return m[0]===2?3:m[0]===1?2:0;
  const line=s[2]==='DF'?1:s[2]==='FV'?7:4,side=s[0]<35?0:s[0]>65?2:1,v=m[line+side];
  if(m[0]===2&&!m[line]&&!m[line+1]&&!m[line+2])return 0;
  return v===2?3:v===1?2:(m[line]||m[line+1]||m[line+2])?1:0}
function fit(p,f,i){const g=slotGrp(f[i]),n=roleName(g,'ip',T().ph.ip.roles[i]),r=((p.roles&&p.roles.ip)||[]).find(x=>x.n===n);
  const base=r&&+r.s?+r.s:(+p.ca||0);return Math.round(base*[.4,.7,.9,1][suit(p,f[i])]*2)/2}
// dışarıdan gelen veriyi (yedek kodu, hesap, tarayıcı kaydı) güvenli hale getirir
function clean(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.teams)||!d.teams.length)return null;
  const id=x=>String(x==null?'':x).replace(/[^a-zA-Z0-9]/g,'').slice(0,40), int=(x,a,b,df)=>{x=Math.round(+x);return x>=a&&x<=b?x:df},
    col=(x,df)=>/^#[0-9a-fA-F]{6}$/.test(x)?x:df, half=x=>{x=Math.round(+x*2)/2;return x>=0&&x<=5?x:0};
  d.cur=id(d.cur);d.sel=id(d.sel);d.tab=['profil','kadro','taktik'].includes(d.tab)?d.tab:'profil';
  d.teams=d.teams.filter(t=>t&&typeof t==='object'&&t.ph&&t.ph.ip&&t.ph.oop); if(!d.teams.length)return null;
  const okImg=x=>typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(x)?x:'';
  d.teams.forEach(t=>{t.id=id(t.id)||uid();t.logo=okImg(t.logo);t.c1=col(t.c1,'#1f7a3d');t.c2=col(t.c2,'#ffffff');
    t.players=Array.isArray(t.players)?t.players.filter(p=>p&&typeof p==='object'&&p.attrs&&p.stats!==null):[];
    if(Array.isArray(t.pids))t.pids=t.pids.map(id); if(Array.isArray(t.bench))t.bench=t.bench.map(id);
    t.tacI=int(t.tacI,0,50,0); if(!t.instr||typeof t.instr!=='object')t.instr={}; Object.keys(t.instr).forEach(k=>t.instr[k]=int(t.instr[k],0,9,0));
    [t].concat(Array.isArray(t.tacs)?t.tacs:[]).forEach(x=>{if(x&&x.ph)['ip','oop'].forEach(k=>{const ph=x.ph[k];if(!ph)return;if(!FORM[ph.f])ph.f='2-3-1';
      if(!Array.isArray(ph.roles)||ph.roles.length!==7)ph.roles=defRoles(ph.f,k==='oop'?1:0);
      ph.pos=Array.isArray(ph.pos)&&ph.pos.length===7&&ph.pos.every(q=>Array.isArray(q))?ph.pos.map(q=>[int(q[0],0,100,50),int(q[1],0,100,50)]):null})});
    t.players.forEach(p=>{p.id=id(p.id)||uid();
      p.photo=typeof p.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p.photo)?p.photo:'';
      p.posmap=DOTS.map((_,i)=>int((p.posmap||[])[i],0,2,0)); p.last5=[0,1,2,3,4].map(i=>int((p.last5||[])[i],0,3,0));
      p.footL=int(p.footL,1,5,2);p.footR=int(p.footR,1,5,5);p.ca=half(p.ca);p.pa=half(p.pa);
      const rs=p.rsel&&typeof p.rsel==='object'?p.rsel:{};p.rsel={ip:int(rs.ip,0,50,0),oop:int(rs.oop,0,50,0)};
      if(!p.roles||typeof p.roles!=='object')p.roles={};['ip','oop'].forEach(k=>{if(!Array.isArray(p.roles[k]))p.roles[k]=[];p.roles[k].forEach(r=>r.s=half(r.s))});

      ['traits','season','career','history'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[]});
    });
  });
  return d;
}

const cls=v=>v===''||v==null||isNaN(v)?'c0':v>=20?'c4':v>=15?'c3':v>=10?'c2':v>=6?'c1':'c0';
function ref(path){const a=path.split('.');let o=a[0]==='p'?P():T();for(let i=1;i<a.length-1;i++)o=o[a[i]];return[o,a[a.length-1]]}
const get=path=>{const[o,k]=ref(path);return o[k]};
const set=(path,v)=>{const[o,k]=ref(path);o[k]=v;save()};
const F=(path,title,ph)=>{const v=get(path);const e=v===''||v==null;return `<button class="fld ${e?'empty':''}" data-k="${path}" data-t="${esc(title)}">${e?esc(ph||'—'):esc(v)}</button>`};
const $=id=>document.getElementById(id);
const avgB=p=>{const a=avg(p);return `<b class="${cls(+a)}">${a}</b>`};
const starsH=(v,attr)=>{let h='';for(let i=1;i<=5;i++)h+=`<i ${attr} data-i="${i}" class="${v>=i?'f':v>=i-.5?'h':''}">★</i>`;return `<span class="stars">${h}</span>`};
const num=s=>{const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:n};

function shirt(t,n){return `<span class="shirt"><svg viewBox="0 0 40 36" aria-hidden="true"><path d="M12 2 2 8l4 9 5-3v20h18V14l5 3 4-9-10-6q-8 6-16 0z" fill="${esc(t.c1)}" stroke="${esc(t.c2)}" stroke-width="1.5"/></svg><b style="color:${esc(t.c2)}">${esc(n)}</b></span>`}
const badgeH=t=>t.logo?`<div class="badge logo"><img src="${esc(t.logo)}" alt=""></div>`:`<div class="badge" style="background:linear-gradient(135deg,${esc(t.c1)} 50%,${esc(t.c2)} 50%)">${esc(t.short||'')}</div>`;

function drawTop(){
  const t=T(); document.documentElement.style.setProperty('--club',t.c1);
  $('top').innerHTML=`<button class="arr" data-act="prev" aria-label="Önceki oyuncu">‹</button><button class="arr" data-act="next" aria-label="Sonraki oyuncu">›</button>${badgeH(t)}
    <nav class="tabs">${[['profil','Profil'],['kadro','Kadro'],['taktik','Taktikler']].map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</nav>
    <div class="date"><b>${F('t.date','Tarih','Tarih')}</b><span>${F('t.next','Sıradaki maç','Sıradaki maç')}</span></div><span class="time">${F('t.time','Saat','Saat')}</span>
    <button class="lock ${S.edit?'on':''}" id="lock">${S.edit?'Düzenleme açık':'Düzenle'}</button>`;
  document.body.classList.toggle('ed',!!S.edit); document.body.classList.toggle('bx',!!S.boxes);
}
function drawWarn(){$('warn').innerHTML=storeOk?'':'<p class="warn">Bu tarayıcı kayıt tutmaya izin vermiyor. Değişiklikleri kaybetmemek için Kadro sekmesindeki yedek kodunu kopyala.</p>'}

function emptyCard(){return `<section class="pn emptyc"><h3>Kadronu kur</h3><p class="note">Henüz oyuncu yok. İsim, soyisim, uyruk, boy, ayak ve 1-20 arası bütün nitelikleri sen belirlersin.</p>
  <button class="btn" data-act="addPlayer">Oyuncu oluştur</button><button class="btn ghost" data-act="demo">Örnek kadroyla başla</button></section>`}
function attrRows(g){return P().attrs[g].map((a,i)=>`<button class="ar ${a[2]?'k'+a[2]:''}" data-attr="${g}.${i}"><span>${esc(a[0])}</span><span class="av ${cls(a[1]===''?'':+a[1])}">${a[1]===''?'–':esc(a[1])}</span></button>`).join('')}
function footH(k,label){const v=+P()[k]||1,c=v<=2?'#f0883a':v===3?'#e2c93b':'#4fe07f';return `<button data-foot="${k}"><span class="lbl">${label}</span><b>${FOOT[v]}</b><span class="bars">${[1,2,3,4,5].map(i=>`<i style="${i<=v?'background:'+c:''}"></i>`).join('')}</span></button>`}

function viewProfil(){
  const t=T(), p=P();
  if(!p) return emptyCard();
  const ini=(((p.first||'')[0]||'')+((p.last||'')[0]||'')).toUpperCase(), rp=RPH(), a=avg(p);
  const sub=`<div class="subbar"><select class="sel" id="playerSel" aria-label="Oyuncu seç">${t.players.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(nm(x))}</option>`).join('')}</select>
    <button class="stab ${S.ptab!=='kariyer'?'on':''}" data-ptab="genel">Genel Bakış</button><button class="stab ${S.ptab==='kariyer'?'on':''}" data-ptab="kariyer">Kariyer</button>

      <span class="dim">${F('p.posname','Mevki adı','Mevki')}</span>
      <span><b>${F('p.natc','Ülke kodu (TUR)','TUR')}</b> &nbsp;<b>${F('p.age','Yaş','Yaş')}</b> yaşında (${F('p.dob','Doğum tarihi','gg/aa/yyyy')})</span></div>
    <div class="hb"><span class="chip st">${F('p.status','Durum etiketi (Ahb, Skt, Cz...)','Durum')}</span>${S.edit&&p.photo?'<button class="mini" data-act="delPhoto">Fotoğrafı kaldır</button>':''}</div>
    <div class="hb sep"><div class="row2">${badgeH(t)}<div><b>${esc(t.name)}</b><span class="lbl">${esc(t.sub||'')}</span></div></div></div>
    <div class="hb sep"><b>${F('p.nat','Uyruk','Uyruk')}</b><span class="dim">${F('p.caps','Millî maç bilgisi','Millî maç')}</span><span class="dim">${F('p.youth','Genç millî takım bilgisi','Genç millî takım')}</span></div>
    <div class="hb sep"><span class="chip val">${F('p.value','Değer','Değer')}</span><span class="dim">${F('p.wage','Maaş','Maaş')} · ${F('p.contract','Sözleşme bitişi','Sözleşme')}</span><span class="dim">${F('p.squadrole','Kadro statüsü','Statü')}</span></div>

  </div></section></div>`;
  const tot=k=>{const s=p.season.reduce((x,r)=>x+num(r[k]),0);return String(Math.round(s*100)/100).replace('.',',')};
  const gk=p.attrs.tek[0]&&p.attrs.tek[0][0]===KAL[0];
  return sub+hdr+`<section class="pn main">
    <div class="cpos"><p class="ct"><span>Pozisyonlar</span></p><b>${F('p.pos','Kısa mevki (KL, DF, OS, FV)','Mevki')}</b>
      <div class="mp">${DOTS.map((d,i)=>`<button class="dot d${p.posmap[i]||0}" data-dot="${i}" style="left:${d[0]}%;top:${d[1]}%" aria-label="Pozisyon noktası"></button>`).join('')}</div>
      <div class="cen">${esc(p.posname)}</div>
      <div class="seg"><button data-rph="ip" class="${rp==='ip'?'on':''}">${PHN.ip}</button><button data-rph="oop" class="${rp==='oop'?'on':''}">${PHN.oop}</button></div>

    <div><p class="ct">Zihinsel</p>${attrRows('zih')}</div>
    <div><p class="ct">Fiziksel</p>${attrRows('fiz')}
      <p class="ct">Kalecilik</p><div class="ar"><span>Kalecilik Becerisi</span><span>${F('p.gkb','Kalecilik becerisi (ör. 3/10)','–')}</span></div>
      <div class="feet">${footH('footL','Sol Ayak')}${footH('footR','Sağ Ayak')}</div>
      <div class="row2" style="margin-top:8px">${S.edit?'<button class="mini on" data-act="fillAttrs">Nitelikleri sırayla gir</button>':''}<button class="mini ${S.boxes?'on':''}" data-act="boxes">Renkli kutular</button></div>
    </div>
    <div class="legend"><span><i style="background:var(--key)"></i>Önemli</span><span><i style="background:var(--pref)"></i>Tercih Edilebilir</span></div>
    <div class="cinfo"><p class="ct"><b style="color:var(--fg);font-size:13px">Bilgi</b></p><div class="info">
      <div><span class="lbl">Boy</span><span class="val">${F('p.height','Boy','—')}</span></div>
      <div><span class="lbl">Kilo</span><span class="val">${F('p.weight','Kilo','—')}</span></div>
      <div><span class="lbl">Forma No</span><span class="val">${F('p.num','Forma numarası','—')}</span></div>
      <div><span class="lbl">İtibar</span><span class="val">${F('p.rep','İtibar','—')}</span></div>
      <div><span class="lbl">Karakter</span><span class="val">${F('p.personality','Karakter','—')}</span></div>
      <div style="flex:1 1 160px"><span class="lbl">Karakteristik Özellikler ${S.edit?'<button class="mini" data-act="addTrait">Ekle</button>':''}</span>
        ${p.traits.map((x,i)=>`<div class="tr"><span style="flex:1;min-width:0">${F('p.traits.'+i,'Karakteristik özellik','Özellik')}</span>${S.edit?`<button class="x" data-act="delTrait" data-i="${i}" aria-label="Özelliği sil">×</button>`:''}</div>`).join('')||'<span class="note">Yok</span>'}</div>
    </div></div>
  </section>
  <div class="tiles">
    <section class="pn tile"><h3>Mutluluk Durumu</h3><span class="big">${F('p.morale','Mutluluk durumu')}</span><span style="color:var(--n-top);font-size:12px">Artılar ${F('p.plus','Artılar')}</span><span style="color:var(--danger);font-size:12px">Eksiler ${F('p.minus','Eksiler')}</span></section>
    <section class="pn tile"><h3>Kondisyon</h3><span class="big">${F('p.cond','Kondisyon')}</span><span class="note">${F('p.condNote','Kondisyon notu','Not')}</span></section>
    <section class="pn tile"><h3>Form</h3><div class="l5">${p.last5.map((v,i)=>`<button class="g${v}" data-l5="${i}" aria-label="Maç sonucu"></button>`).join('')}</div><span class="pill">${F('p.form','Form puanı')}</span><span class="note">Son 5 maç</span></section>
    <section class="pn tile"><h3>Antrenman</h3><b>${F('p.train','Antrenman yorumu','Yorum')}</b><span class="note">Antrenman Puanı</span><span class="pill red">${F('p.trainScore','Antrenman puanı')}</span></section>
    <section class="pn tile wide"><h3>Sezon İstatistikleri${S.edit?'<button class="mini" data-act="addSeason">Turnuva ekle</button>':''}</h3><div class="scroll"><table class="tbl"><thead><tr><th>Turn</th>${SCOLS.map(c=>`<th class="r">${c[1]}</th>`).join('')}${S.edit?'<th></th>':''}</tr></thead><tbody>

}

    <table class="tbl"><thead><tr><th>No</th><th>Mevki</th><th>Oyuncu</th><th class="r">Yaş</th><th class="r">Ort.</th></tr></thead><tbody>

function draw(){
  const t=T(); S.cur=t.id;
  if(!Array.isArray(t.pids)||t.pids.length!==7) t.pids=Array.from({length:7},(_,i)=>(t.pids||[])[i]||'');

  $('main').innerHTML=S.tab==='kadro'?viewKadro():S.tab==='taktik'?viewTaktik():viewProfil();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  if(S.tab!=='taktik'||(e.pointerType==='mouse'&&e.button!==0))return;

document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.hypot(dx,dy)<7)return;drag.on=true;drag.el.classList.add('drag');try{drag.el.setPointerCapture(drag.id)}catch(_){}}
  drag.el.style.translate=dx+'px '+dy+'px';
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return; const d=drag; drag=null; if(!d.on)return;
  dragEnd=Date.now();
  if(cancel){draw();return}
  d.el.style.visibility='hidden'; const hit=document.elementFromPoint(e.clientX,e.clientY); d.el.style.visibility='';
  const t=T(), ph=PH(), ts=hit&&hit.closest('.pitch [data-slot]'), tb=hit&&hit.closest('.ybox [data-asg]');
  const fromBench=(pid,j)=>{const b=t.bench.indexOf(pid),cur=t.pids[j];t.pids[j]=pid;if(b>=0){if(cur)t.bench[b]=cur;else t.bench.splice(b,1)}};
  if(d.slot>=0){
    if(ts){const j=+ts.dataset.slot,x=t.pids[d.slot];t.pids[d.slot]=t.pids[j];t.pids[j]=x}
    else if(tb){fromBench(tb.dataset.asg,d.slot)}
    else if(d.slot>0){const pitch=document.querySelector('.pitch');if(pitch){const r=pitch.getBoundingClientRect(),f=curF(ph);if(!ph.pos)ph.pos=f.map(s=>[s[0],s[1]]);
      ph.pos[d.slot]=[Math.round(clamp(f[d.slot][0]+(e.clientX-d.x)/r.width*100,11,89)),Math.round(clamp(f[d.slot][1]+(e.clientY-d.y)/r.height*100,12,80))];const g2=slotGrp(curF(ph)[d.slot]);if(g2!==slotGrp(f[d.slot])){t.ph.ip.roles[d.slot]=ROLE[g2].ip[0][0];t.ph.oop.roles[d.slot]=ROLE[g2].oop[0][0]}}}
  }else if(d.pid){
    if(ts)fromBench(d.pid,+ts.dataset.slot);
    else if(tb){const a=t.bench.indexOf(d.pid),b=t.bench.indexOf(tb.dataset.asg);if(a>=0&&b>=0){t.bench[a]=tb.dataset.asg;t.bench[b]=d.pid}}
  }
  save();draw();
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('click',e=>{if(Date.now()-dragEnd<400){e.stopPropagation();e.preventDefault()}},true);

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const el=e.target, q=s=>el.closest(s);
  if(el.id==='sheet'){closeSheet();return}
  let m;
  if(m=q('[data-tab]')){S.tab=m.dataset.tab;save();draw();scrollTo(0,0);return}
  if(m=q('[data-ptab]')){S.ptab=m.dataset.ptab;save();draw();return}
  if(m=q('[data-phase]')){S.phase=m.dataset.phase;save();draw();return}
  if(m=q('[data-rph]')){S.rph=m.dataset.rph;save();draw();return}
  if(q('#lock')){S.edit=!S.edit;save();draw();return}
  const t=T(), p=P();
  if(m=q('[data-star]')){if(S.edit){const k=m.dataset.star,i=+m.dataset.i;p[k]=(+p[k]===i)?i-.5:i;save();draw()}return}
  if(m=q('[data-rstar]')){if(S.edit){const r=p.roles[RPH()][+m.dataset.rstar],i=+m.dataset.i;r.s=(+r.s===i)?i-.5:i;save();draw()}return}
  if(m=q('[data-rsel]')){p.rsel[RPH()]=+m.dataset.rsel;save();draw();return}
  if(m=q('[data-dot]')){if(S.edit){const i=+m.dataset.dot;p.posmap[i]=((p.posmap[i]||0)+1)%3;save();draw()}return}
  if(m=q('[data-foot]')){if(S.edit){const k=m.dataset.foot;p[k]=(+p[k]||1)%5+1;save();draw()}return}
  if(m=q('[data-l5]')){if(S.edit){const i=+m.dataset.l5;p.last5[i]=((p.last5[i]||0)+1)%4;save();draw()}return}
  if(m=q('[data-k]')){if(S.edit)editField(m.dataset.k,m.dataset.t);return}
  if(m=q('[data-attr]')){if(S.edit){const a=m.dataset.attr.split('.');editAttr(a[0],+a[1],false)}return}
  if(m=q('[data-slot],[data-slotrow]')){editSlot(+(m.dataset.slot??m.dataset.slotrow));return}
  if(m=q('[data-ttab]')){S.ttab=m.dataset.ttab;save();draw();return}
  if(m=q('[data-ins]')){T().instr[m.dataset.ins]=+m.dataset.v;save();draw();return}
  if(m=q('[data-asg]')){assignSheet(m.dataset.asg);return}
  if(m=q('[data-go]')){S.sel=m.dataset.go;S.tab='profil';save();draw();scrollTo(0,0);return}
  const a=q('[data-act]'); if(!a)return; const act=a.dataset.act, rp=RPH(), idx=+a.dataset.i;
  if(act==='close'){closeSheet()}
  else if(act==='prev'||act==='next'){const n=t.players.length;if(!n)return;const i=t.players.indexOf(p);S.sel=t.players[(i+(act==='next'?1:n-1))%n].id;S.tab='profil';save();draw()}
  else if(act==='photo'){if(S.edit){imgTarget='photo';$('photoIn').click()}}
  else if(act==='delPhoto'){p.photo='';save();draw()}
  else if(act==='logo'){imgTarget='logo';$('photoIn').click()}
  else if(act==='delLogo'){t.logo='';save();draw()}
  else if(act==='boxes'){S.boxes=!S.boxes;save();draw()}
  else if(act==='fillAttrs'){editAttr('tek',0,true)}
  else if(act==='gk'){const toGk=p.attrs.tek[0][0]!==KAL[0],names=toGk?KAL:TEK;p.attrs.tek=names.map((n,i)=>[n,(p.attrs.tek[i]||[0,''])[1],0]);save();draw()}
  else if(act==='addRole'){p.roles[rp].push({n:'Yeni Rol',s:0});save();draw()}
  else if(act==='delRole'){p.roles[rp].splice(idx,1);p.rsel[rp]=0;save();draw()}
  else if(act==='addTrait'){p.traits.push('Yeni özellik');save();draw()}
  else if(act==='delTrait'){p.traits.splice(idx,1);save();draw()}
  else if(act==='addSeason'){p.season.push({c:'Kupa',mac:'0',gol:'0',asist:'0',xg:'0',pen:'0',mom:'0',sar:'0',kir:'0'});save();draw()}
  else if(act==='delSeason'){p.season.splice(idx,1);save();draw()}
  else if(act==='addHist'){const d=new Date();p.history.unshift({d:d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),t:'Yeni olay'});save();draw()}
  else if(act==='delHist'){p.history.splice(idx,1);save();draw()}
  else if(act==='addCar'){p.career.unshift({s:'2026/27',t:t.name,mac:'0',gol:'0',asist:'0',puan:'-'});save();draw()}
  else if(act==='delCar'){p.career.splice(idx,1);save();draw()}
  else if(act==='delPlayer'){confirmTap(a,()=>{t.players=t.players.filter(x=>x!==p);t.pids=t.pids.map(x=>x===p.id?'':x);S.sel=(t.players[0]||{}).id||'';S.tab='kadro';save();draw()})}
  else if(act==='addPlayer'){createPlayer()}
  else if(act==='quick'){quickPick();save();draw()}
  else if(act==='tacAdd'){t.tacs[t.tacI]=tacSnap(t);const c=tacSnap(t);c.tacName='Taktik '+(t.tacs.length+1);t.tacs.push(c);Object.assign(t,JSON.parse(JSON.stringify(c)));t.tacI=t.tacs.length-1;save();draw()}
  else if(act==='tacDel'){confirmTap(a,()=>{t.tacs.splice(t.tacI,1);t.tacI=0;Object.assign(t,JSON.parse(JSON.stringify(t.tacs[0])));save();draw()})}
  else if(act==='demo'){const d=demoTeam();d.id=t.id;S.teams[S.teams.indexOf(t)]=d;S.sel=d.players[6].id;save();draw()}
  else if(act==='newTeam'){const nt=mkTeam({name:'Yeni Takım',short:'YT',c1:'#b3202e'});S.teams.push(nt);S.cur=nt.id;S.sel='';S.edit=true;save();draw()}
  else if(act==='delTeam'){confirmTap(a,()=>{S.teams=S.teams.filter(x=>x!==t);S.cur=S.teams[0].id;S.sel=(S.teams[0].players[0]||{}).id||'';save();draw()})}
  else if(act==='bkCopy'){const code=JSON.stringify(S);$('bk').value=code;const done=x=>{$('bkMsg').textContent=x};
    try{navigator.clipboard.writeText(code).then(()=>done('Kopyalandı'),()=>{$('bk').select();done('Kutudan elle kopyala')})}catch(err){$('bk').select();done('Kutudan elle kopyala')}}
  else if(act==='bkLoad'){try{const d=clean(JSON.parse($('bk').value));if(!d||d.v!==3)throw 0;S=d;save();draw();$('bkMsg').textContent='Yüklendi'}catch(err){$('bkMsg').textContent='Kod okunamadı. Tamamını yapıştırdığından emin ol.'}}
});
document.addEventListener('change',e=>{
  const el=e.target, t=T();
  if(el.id==='playerSel'){S.sel=el.value;save();draw()}
  else if(el.id==='teamSel'){S.cur=el.value;S.sel=(T().players[0]||{}).id||'';save();draw()}
  else if(el.id==='formSel'){if(!el.value)return;const ph=PH();ph.pos=null;ph.f=el.value;ph.roles=defRoles(el.value,S.phase==='oop'?1:0);save();draw()}
  else if(el.id==='mentSel'){t.mentality=el.value;save()}
  else if(el.id==='tacSel'){tacSwitch(+el.value);save();draw()}
  else if(el.id==='sysSel'){const p=SYS[el.value];t.system=el.value;if(p){t.mentality=p[0];t.instr=Object.assign({},p[1])}save();draw()}
  else if(el.id==='c1'||el.id==='c2'){t[el.id]=el.value;save();drawTop()}
  else if(el.id==='photoIn'){const file=el.files&&el.files[0];if(!file)return;const logo=imgTarget==='logo';const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');
      if(logo){c.width=c.height=128;const k=Math.min(128/im.width,128/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(128-w)/2,(128-h)/2,w,h);T().logo=c.toDataURL('image/png')}
      else{const w=Math.min(im.width,im.height*0.885),h=w/0.885;c.width=230;c.height=260;x.drawImage(im,(im.width-w)/2,Math.max(0,(im.height-h)/4),w,h,0,0,230,260);P().photo=c.toDataURL('image/jpeg',.82)}
      save();draw()};im.src=r.result};r.readAsDataURL(file);el.value=''}
});
